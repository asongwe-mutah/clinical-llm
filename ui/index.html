<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clinical-LLM — demo</title>
<style>
  :root {
    --bg: #0f1720; --panel: #16212e; --ink: #e6edf3; --muted: #8b98a5;
    --accent: #4c8bf5; --user: #1f6feb; --bot: #21313f; --warn: #3a2a12; --warn-ink: #f2c879;
    --border: #24313f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  header .tag { color: var(--muted); font-size: 12px; }
  .banner { background: var(--warn); color: var(--warn-ink); font-size: 12.5px; padding: 8px 20px; border-bottom: 1px solid var(--border); }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { padding: 11px 14px; border-radius: 12px; max-width: 78%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
  .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); max-width: 860px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--ink); border: 1px solid var(--border);
             border-radius: 10px; padding: 11px 12px; font: inherit; height: 46px; }
  button { background: var(--accent); color: white; border: 0; border-radius: 10px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>Clinical-LLM</h1>
    <span class="tag">domain-adapted clinical informatics assistant · research demo</span>
  </header>
  <div class="banner">⚠️ Research demo only. Outputs may be wrong and are <b>not medical advice</b>. Do not enter real patient data (PHI).</div>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Ask a clinical / medical question…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const history = [];

  function bubble(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    el.innerHTML = '<div class="role">' + role + '</div>';
    const body = document.createElement('span');
    body.textContent = text;
    el.appendChild(body);
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return body;
  }

  async function ask(message) {
    bubble('user', message);
    const out = bubble('assistant', '');
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '', buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const payload = JSON.parse(line.slice(5).trim());
        if (payload.token) { full += payload.token; out.textContent = full; log.scrollTop = log.scrollHeight; }
      }
    }
    history.push({ role: 'user', content: message });
    history.push({ role: 'assistant', content: full });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    send.disabled = true;
    try { await ask(message); }
    catch (err) { bubble('assistant', '[error] ' + err.message); }
    finally { send.disabled = false; input.focus(); }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
</script>
</body>
</html>
