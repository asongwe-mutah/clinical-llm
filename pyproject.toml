[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-llm"
version = "0.1.0"
description = "Domain-adapted language model for clinical informatics (QLoRA fine-tune + eval + serving)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Asongwe Mutah" }]
keywords = ["llm", "clinical-nlp", "qlora", "peft", "medical-ai", "healthcare"]

# Runtime deps needed just to *import and unit-test* the dependency-light core
# (data formatting, config). The heavy ML stack lives in the [train]/[serve]
# extras so `pip install -e .` on a laptop stays fast.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "peft>=0.12",
    "trl>=0.9",
    "accelerate>=0.33",
    "bitsandbytes>=0.43 ; platform_system == 'Linux'",
    "sentencepiece>=0.2",
]
serve = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
clinical-llm-prepare = "clinical_llm.data.prepare:main"
clinical-llm-train = "clinical_llm.train.train_qlora:main"
clinical-llm-eval = "clinical_llm.eval.run_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
