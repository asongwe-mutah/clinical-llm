# QLoRA fine-tune for a GPU with NATIVE bf16 -- L4, A100, H100, RTX 30/40-series.
# (Ampere sm_80+. On a T4 use configs/train_colab.yaml instead.)
#
# PAIR THIS WITH configs/data_gpu.yaml, not data_colab.yaml.
#
# ---------------------------------------------------------------------------
# MEASURED, not estimated. A previous version of this file ran seq-len 2048 /
# effective batch 32 on a Colab L4 and got 161 s/it -- 402 tokens/s, about 8%
# of the card's bf16 peak. It reached step 94 of 500 in 4h11m before Colab
# reclaimed the session, six steps short of the first checkpoint.
#
# Cause: flash-attn is not installed on stock Colab, so attn falls back to
# sdpa. With packing=True, sdpa gets a packed attention mask it cannot handle
# in its flash or mem-efficient backends and drops to the MATH backend, which
# materialises the full seq x seq score matrix every layer. At seq 2048 that
# is ~39 GB of traffic per forward across 36 layers, on a card with ~300 GB/s.
# The GPU spends its life waiting on memory.
#
# Halving seq-len cuts that quadratic term 4x. Our samples are short medical
# QA (~400 tokens), so 2048 bought nothing but attention cost.
#
# PACKING IS NOW OFF, and that is a correctness fix with a speed bonus.
#
# With packing=True and no FA2, sdpa receives a packed attention mask it
# cannot serve from its flash or mem-efficient kernels, so it falls back to
# the MATH backend and materialises the full seq x seq matrix -- which is why
# the 300-step run crawled at 402 tok/s, 8% of the card's peak. It also meant
# packed samples attended across each other, corrupting the training signal.
# The resulting adapter fixed 160 MedMCQA items but broke 102 (1.57:1); the
# noisy signal is the leading suspect.
#
# Unpacked, each sequence gets a plain causal mask, sdpa uses its fast path,
# and examples no longer bleed into one another. Expect BETTER throughput than
# the packed run despite padding waste.
#
# Step budget changes shape: 1 sample = 1 sequence, so at effective batch 16
# one epoch is ~2,600 steps rather than ~1,040.
#   800 steps  = 0.31 epoch  (~1.1x the 300-step packed run)
#  1200 steps  = 0.46 epoch  (~1.6x)          <- current setting
#  2600 steps  = 1.00 epoch  (~3.5x)
# Check the throughput probe at step 3: under ~8 s/it, raising max_steps
# toward 2600 fits a session. eval_loss now actually runs (every 100 steps) --
# if it turns upward, stop and keep the earlier checkpoint.
#
# The trainer now prints a throughput probe after 3 steps and warns if the
# projected total exceeds 4 hours. CHECK IT before walking away.
#
# Token budget is what matters, not epoch fraction. 300 steps here is
# ~4.9M training tokens -- about 4x the 150-step August run (~1.2M). One full
# epoch over the 41.5k-sample corpus is ~17M tokens; raise max_steps toward
# ~1000 only if throughput allows and eval_loss is still falling.
# ---------------------------------------------------------------------------

data_dir: data/processed
output_dir: outputs/clinical-qlora   # override with --output-dir for Drive

model:
  base_model: Qwen/Qwen2.5-3B-Instruct
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16   # genuinely native here
  bnb_4bit_quant_type: nf4
  max_seq_len: 1024                  # was 2048; see the measurement above
  trust_remote_code: false
  attn_implementation: auto          # flash_attention_2 if installed, else sdpa

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

epochs: 1.0
max_steps: 1200                 # 0.46 epoch unpacked; see the budget above
per_device_batch_size: 8
grad_accum: 2                   # effective batch = 16
learning_rate: 2.0e-4
warmup_ratio: 0.03
weight_decay: 0.0
lr_scheduler_type: cosine
logging_steps: 10
save_steps: 50                  # ~4% of the run; cheap insurance
eval_steps: 100                 # NOW ACTUALLY RUNS -- watch for eval_loss rising
bf16: true
gradient_checkpointing: true
packing: false                  # see the header: correctness AND speed
seed: 13
